version: 1.3.13
cache: true

# Snck — AI Platform
# User-configurable OpenAI-compatible inference plus a private local model service.
interface:
  remoteAgents:
    use: true
    create: true

endpoints:
  custom:
    - name: "Snck Custom API"
      apiKey: "user_provided"
      baseURL: "user_provided"
      models:
        default:
          - "your-model"
        fetch: true
      titleConvo: true
      titleModel: "current_model"
      modelDisplayLabel: "Custom / Third-Party API"

    - name: "Snck Local"
      apiKey: "snck-local"
      baseURL: "http://ollama:11434/v1/"
      models:
        default:
          - "llama3.2:3b"
        fetch: true
      titleConvo: true
      titleModel: "current_model"
      modelDisplayLabel: "Snck Local"
